<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Infinite Horizons - Survivors</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05070c;
  font-family:'Segoe UI',Roboto,system-ui,sans-serif;color:#dbe7f3;user-select:none;
  -webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none;
  --accent:#4fc3f7;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none !important}
#err{position:fixed;top:0;left:0;right:0;background:#3a0a0a;color:#ffb3b3;padding:8px;
  font-family:monospace;font-size:11px;z-index:9999;display:none;white-space:pre-wrap;max-height:30%;overflow:auto}
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
#topbar{position:absolute;top:0;left:0;right:0;padding:8px 10px;display:flex;gap:10px;align-items:center;
  background:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,0));font-size:12px;flex-wrap:wrap}
.bar{position:relative;height:14px;border-radius:7px;background:#101a24;overflow:hidden;border:1px solid #23384a}
.bar>i{position:absolute;inset:0;width:0%;display:block;transition:width .08s linear}
#hpbar{width:180px}
#hpbar>i{background:linear-gradient(90deg,#e53935,#ff7043)}
#xpbar{width:140px;height:9px}
#xpbar>i{background:linear-gradient(90deg,#29b6f6,#7c4dff)}
.bar span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:14px;text-shadow:0 1px 2px #000;font-weight:600}
#timer{font-size:20px;font-weight:700;letter-spacing:1px;text-shadow:0 0 10px var(--accent)}
#hudright{margin-left:auto;display:flex;gap:10px;font-size:12px;align-items:center}
#hudright b{color:var(--accent)}
#weapons{position:absolute;left:8px;bottom:8px;display:flex;gap:5px;flex-wrap:wrap;max-width:60%}
.wslot{width:42px;height:42px;border-radius:8px;background:rgba(8,16,24,.85);border:1px solid #26404f;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;position:relative;color:#dff1ff;letter-spacing:.3px}
.wslot i{position:absolute;bottom:1px;right:3px;font-size:9px;font-style:normal;color:#9fb8c8}
.wslot.max{border-color:#ffd54f;box-shadow:0 0 8px rgba(255,213,79,.5)}
.wslot.evo{border-color:#b388ff;box-shadow:0 0 10px rgba(179,136,255,.6)}
#bossbar{position:absolute;top:52px;left:50%;transform:translateX(-50%);width:min(560px,85%);text-align:center}
#bossbar .bar{height:16px}
#bossbar .bar>i{background:linear-gradient(90deg,#8e24aa,#e91e63)}
#bossbar p{font-size:12px;letter-spacing:2px;margin-bottom:3px;color:#ff8ab5;text-shadow:0 0 8px #e91e63}
#btnPause{position:absolute;top:6px;right:8px;pointer-events:auto;width:34px;height:34px;
  border-radius:50%;background:rgba(10,20,30,.7);border:1px solid #2c4b60;color:#dff1ff;
  font-size:14px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:11;padding:0}
body.touch #btnPause{display:flex}
#btnGlobalBack{position:fixed;top:10px;left:10px;z-index:100;padding:9px 16px;font-size:12px;
  font-weight:700;letter-spacing:1px;background:rgba(10,20,30,.92);border:1px solid var(--accent);
  border-radius:10px;color:#dff1ff;cursor:pointer;display:none;min-height:38px;
  box-shadow:0 4px 14px rgba(0,0,0,.6)}
#btnGlobalBack.on{display:block}
#screens{position:absolute;inset:0;z-index:20;pointer-events:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;
  background:radial-gradient(circle at 50% 40%,rgba(10,20,32,.9),rgba(2,4,8,.98));
  pointer-events:auto;padding:56px 16px 24px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.screen.on{display:flex}
h1{font-size:32px;letter-spacing:4px;font-weight:800;margin-bottom:2px;text-align:center;
  background:linear-gradient(90deg,var(--accent),#b388ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:18px;letter-spacing:2px;margin-bottom:10px;color:var(--accent);text-transform:uppercase;text-align:center}
.sub{color:#7f9bb0;font-size:12px;margin-bottom:14px;letter-spacing:.5px;text-align:center;max-width:600px}
button{font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.5px;color:#dff1ff;cursor:pointer;
  background:linear-gradient(180deg,#16283a,#0d1926);border:1px solid #2c4b60;border-radius:10px;
  padding:10px 16px;transition:.15s;margin:4px;min-height:40px}
button:hover:not(:disabled){border-color:var(--accent);box-shadow:0 0 12px rgba(79,195,247,.35)}
button:active:not(:disabled){transform:scale(.97)}
button.primary{background:linear-gradient(180deg,#1e5f8a,#123c5a);border-color:var(--accent)}
button.dev{border-color:#ff8a65;color:#ffab91}
button.dev.on{background:linear-gradient(180deg,#7a2a1a,#4a1a10);border-color:#ff5722}
button.fuse{background:linear-gradient(180deg,#7c2dd6,#4a1580);border-color:#b388ff;color:#e1bee7;
  box-shadow:0 0 20px rgba(179,136,255,.5);animation:fusePulse 1.5s infinite}
@keyframes fusePulse{0%,100%{box-shadow:0 0 20px rgba(179,136,255,.5)}50%{box-shadow:0 0 30px rgba(179,136,255,.9)}}
button.small{padding:5px 10px;font-size:11px;min-height:28px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:1200px;width:100%}
.card{width:200px;background:rgba(11,22,33,.92);border:1px solid #24404f;border-radius:12px;padding:10px;
  text-align:left;transition:.15s;cursor:pointer;position:relative;display:flex;flex-direction:column}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.6)}
.card:active{transform:scale(.98)}
.card h4{font-size:14px;letter-spacing:.5px;margin-bottom:4px;color:#eaf6ff}
.card p{font-size:11px;color:#8aa7ba;line-height:1.4;flex:1}
.card .tag{font-size:10px;color:#5f7d90;margin-top:4px}
.card .price{margin-top:6px;font-size:12px;color:#ffd54f;font-weight:700}
.card.locked{opacity:.7}
.card .lock{position:absolute;top:8px;right:10px;font-size:11px;color:#ffd54f;z-index:2;font-weight:700;letter-spacing:.5px}
.card .preview{width:100%;height:70px;background:rgba(4,10,18,.6);border-radius:8px;margin-bottom:6px;
  display:block;border:1px solid #1a2a38}
.card.sel{border-color:#7ee0a8;box-shadow:0 0 0 1px #7ee0a8 inset}
.card.fusion{border-color:#b388ff;background:linear-gradient(180deg,rgba(60,20,110,.95),rgba(20,8,40,.95))}
.ucard{width:300px;background:rgba(11,22,33,.95);border:2px solid #24404f;border-radius:12px;padding:14px;cursor:pointer;transition:.15s}
.ucard:hover{border-color:var(--accent);transform:translateY(-2px)}
.ucard h4{font-size:15px;margin-bottom:6px;color:#eaf6ff}
.ucard .lvl{font-size:10px;color:#ffd54f;letter-spacing:1px;font-weight:700;margin-bottom:4px}
.ucard .gain{font-size:13px;font-weight:700;color:#7ee0a8;margin:6px 0;padding:6px 8px;
  background:rgba(20,50,35,.5);border-left:3px solid #7ee0a8;border-radius:4px}
.ucard .desc{font-size:11px;color:#8aa7ba;line-height:1.4}
.icard{width:260px;background:linear-gradient(180deg,rgba(20,30,45,.97),rgba(8,12,20,.97));
  border:2px solid #24404f;border-radius:12px;padding:14px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.icard:hover{transform:translateY(-3px);box-shadow:0 8px 26px rgba(0,0,0,.7)}
.icard .rarity{position:absolute;top:0;left:0;right:0;height:3px}
.icard.rarity-common{border-color:#5f7d90}.icard.rarity-common .rarity{background:#8aa7ba}
.icard.rarity-rare{border-color:#4fc3f7}.icard.rarity-rare .rarity{background:#4fc3f7}
.icard.rarity-epic{border-color:#b388ff}.icard.rarity-epic .rarity{background:#b388ff}
.icard.rarity-legendary{border-color:#ffd54f}.icard.rarity-legendary .rarity{background:#ffd54f;box-shadow:0 0 12px #ffd54f}
.icard.rarity-cursed{border-color:#ff1744}.icard.rarity-cursed .rarity{background:#ff1744;box-shadow:0 0 12px #ff1744}
.icard h4{font-size:15px;margin:4px 0 6px;color:#eaf6ff}
.icard .icon{font-size:38px;text-align:center;margin-bottom:6px}
.icard .effect{font-size:12px;color:#7ee0a8;font-weight:600;margin:4px 0;line-height:1.5}
.icard.cursed .effect{color:#ff8a80}
.icard .flavor{font-size:10px;color:#5f7d90;font-style:italic;margin-top:6px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.tabs button{padding:7px 12px;font-size:11px;min-height:32px}
.tabs button.on{background:linear-gradient(180deg,#1e5f8a,#123c5a);border-color:var(--accent)}
.currency{display:flex;gap:18px;margin-bottom:14px;font-size:14px;justify-content:center}
.currency b{font-weight:800}
.soft{color:#7ee0a8}.hard{color:#ffd54f}
.tree{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;width:100%}
.branch{display:flex;flex-direction:column;gap:6px;align-items:center;min-width:170px}
.branch h4{font-size:11px;letter-spacing:1px;color:var(--accent);margin-bottom:2px}
.node{width:170px;padding:6px 9px;border-radius:8px;border:1px solid #24404f;background:rgba(10,20,30,.9);
  font-size:11px;cursor:pointer;text-align:left}
.node.owned{border-color:#3ddc84;background:rgba(20,50,35,.85);cursor:default}
.node.locked{opacity:.4;cursor:not-allowed}
.node.key{border-color:#b388ff}.node.cap{border-color:#ffd54f;background:rgba(40,32,10,.8)}
.node b{display:block;font-size:11px;color:#eaf6ff;margin-bottom:1px}
.node small{color:#7f9bb0;font-size:10px}
.node .c{float:right;color:#7ee0a8;font-weight:700}
.msg{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(10,25,40,.95);
  border:1px solid var(--accent);border-radius:8px;padding:9px 16px;font-size:12px;z-index:60;
  opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.msg.on{opacity:1;bottom:96px}
.endstat{font-size:13px;color:#9fb8c8;margin:3px;text-align:center}
.endstat b{color:#eaf6ff}
.stats-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.hint{font-size:11px;color:#5f7d90;text-align:center;margin-top:14px;font-style:italic}
#devBadge{position:fixed;top:10px;left:50%;transform:translateX(-50%);
  background:rgba(255,87,34,.9);color:#fff;padding:3px 12px;border-radius:10px;
  font-size:10px;font-weight:700;letter-spacing:1px;z-index:30;display:none}
body.dev #devBadge{display:block}
@media (max-width:600px){
  h1{font-size:24px;letter-spacing:2px}
  h2{font-size:16px}
  .card{width:calc(50% - 5px);min-width:150px;padding:8px}
  .card .preview{height:60px}
  .branch{min-width:140px}
  .node{width:140px}
  #hpbar{width:130px}
  #xpbar{width:100px}
  #timer{font-size:16px}
  #hudright{font-size:11px;gap:7px}
  .screen{padding:52px 10px 16px}
  .ucard,.icard{width:calc(100% - 4px);max-width:340px}
}
</style>
</head>
<body>
<div id="err"></div>
<div id="devBadge">DEV MODE</div>
<button id="btnGlobalBack">&larr; BACK</button>
<canvas id="cv"></canvas>
<div id="hud" class="hide">
  <div id="topbar">
    <div id="hpbar" class="bar"><i></i><span></span></div>
    <div id="xpbar" class="bar"><i></i><span></span></div>
    <div id="timer">00:00</div>
    <div id="hudright">
      <div>LV <b id="hudlv">1</b></div>
      <div>K <b id="hudkills">0</b></div>
      <div><b class="soft" id="hudsoft">0</b></div>
    </div>
  </div>
  <div id="bossbar" class="hide"><p id="bossname">BOSS</p><div class="bar"><i></i></div></div>
  <div id="weapons"></div>
</div>
<button id="btnPause">||</button>
<div id="screens"></div>
<div class="msg" id="msg"></div>

<script>
(function(){
"use strict";
var $id = function(id){ return document.getElementById(id); };
window.onerror = function(m, src, ln, col){
  var e = $id('err'); if(!e) return;
  e.style.display='block'; e.textContent += 'ERR: '+m+' @'+ln+':'+col+'\n';
};
function rand(a,b){ if(b===undefined){b=a;a=0;} return a+Math.random()*(b-a); }
function randInt(a,b){ return Math.floor(rand(a,b+1)); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function dist(a,b,c,d){ return Math.hypot(a-c,b-d); }
function hash2(x,y){ var n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=randInt(0,i); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmtTime(s){ s=Math.max(0,Math.floor(s)); var m=Math.floor(s/60); return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function pointLineDist(px,py,x1,y1,x2,y2){
  var dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
  if(l2===0) return Math.hypot(px-x1,py-y1);
  var t=clamp(((px-x1)*dx+(py-y1)*dy)/l2,0,1);
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}
var IS_TOUCH = ('ontouchstart' in window)||(navigator.maxTouchPoints>0);
if(IS_TOUCH) document.body.classList.add('touch');

/* Build screens */
var SCREEN_IDS = ['s-main','s-biome','s-chars','s-armory','s-tree','s-shop','s-levelup','s-pause','s-end','s-chest','s-fuse'];
(function(){ var c=$id('screens'); for(var i=0;i<SCREEN_IDS.length;i++){ var d=document.createElement('div'); d.className='screen'; d.id=SCREEN_IDS[i]; c.appendChild(d); } })();

/* Save */
var SAVE_KEY='infinite_horizons_v4';
function defaultSave(){ return {
  soft:0, hard:0, chars:['vanguard'], weapons:['pulseRifle','orbitBlades','scattergun'],
  biomes:[0], beaten:[], endless:[], tree:[], respecs:0, cosmetics:[],
  equip:{char:null,weapon:null,ui:null,ability:null},
  dlc:[], runs:0, kills:0, bossKills:0, selectedChar:'vanguard', devMode:false, fusionsSeen:[]
};}
var save;
try{ var raw=localStorage.getItem(SAVE_KEY); save = raw ? Object.assign(defaultSave(), JSON.parse(raw)) : defaultSave(); }
catch(e){ save = defaultSave(); }
if(!save.fusionsSeen) save.fusionsSeen=[];
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
function msg(t){ var m=$id('msg'); if(!m) return; m.textContent=t; m.classList.add('on'); clearTimeout(m._t); m._t=setTimeout(function(){m.classList.remove('on');},1900); }

/* ===== CHARACTERS ===== */
var CHARACTERS=[
 {id:'vanguard',name:'Vanguard',cost:0,hp:110,spd:170,dmg:1.00,cd:1.00,weapon:'pulseRifle',
  color:'#4fc3f7',accent:'#81d4fa',shape:'shield',
  passive:'Bulwark: +10% Max HP, +1 Armor',tags:{hp:0.10,armor:1},
  desc:'Frontline soldier. Reliable, durable, forgiving.'},
 {id:'ember',name:'Ember',cost:1200,hp:85,spd:184,dmg:1.15,cd:1.05,weapon:'flamethrower',
  color:'#ff7043',accent:'#ffca28',shape:'flame',
  passive:'Ignition: Burns deal +50% damage',tags:{burnBonus:0.5},
  desc:'Pyromancer. Burns everything, fragile.'},
 {id:'nyx',name:'Nyx',cost:1800,hp:92,spd:174,dmg:1.05,cd:1.10,weapon:'frostNova',
  color:'#81d4fa',accent:'#e1f5fe',shape:'crystal',
  passive:'Chill: Chilled enemies take +25% damage',tags:{chillBonus:0.25},
  desc:'Cryomancer. Controls the field with ice.'},
 {id:'voidwalker',name:'Voidwalker',cost:2600,hp:88,spd:178,dmg:1.20,cd:0.95,weapon:'blackhole',
  color:'#b388ff',accent:'#e1bee7',shape:'void',
  passive:'Entropy: +10% Crit, +25% Crit Damage',tags:{crit:0.10,critdmg:0.25},
  desc:'Rift-touched. High risk, high damage.'},
 {id:'circuit',name:'Circuit',cost:-1,hp:95,spd:190,dmg:1.10,cd:1.20,weapon:'teslaCoil',
  color:'#69f0ae',accent:'#18ffff',shape:'circuit',dlc:'neon',
  passive:'Overclock: +20% Attack Speed',tags:{haste:0.20},
  desc:'DLC: Rogue AI made flesh. Lightning fast.'}
];

/* ===== BIOMES ===== */
var BIOMES=[
 {id:0,name:'Verdant Hollow',accent:'#7cb342',bg:'#0b160e',bg2:'#122417',deco:'#1d3a24',
  hazard:'thorn',boss:'Root Colossus',
  enemies:['thornling','sprinter','spitter','brute'],
  desc:'Endless overgrown wilds. Thorn patches slow the unwary.'},
 {id:1,name:'Ember Wastes',accent:'#ff7043',bg:'#170a07',bg2:'#2a0f08',deco:'#3d1a0d',
  hazard:'lava',boss:'Cinder Titan',
  enemies:['emberling','hound','flamespitter','ashbrute'],
  desc:'Scorched plains. Lava pools burn on contact.'},
 {id:2,name:'Frozen Abyss',accent:'#81d4fa',bg:'#08131c',bg2:'#0e2233',deco:'#16374d',
  hazard:'ice',boss:'Glacier Leviathan',
  enemies:['frostling','shardcaster','golem','wisp'],
  desc:'Boundless glacier. Ice fields freeze your movement.'},
 {id:3,name:'Void Rift',accent:'#b388ff',bg:'#0d0817',bg2:'#180e2b',deco:'#25153f',
  hazard:'void',boss:'Void Sovereign',
  enemies:['voidspawn','rifteye','nullwalker','devourer'],
  desc:'Shattered dimension. Rifts tear at body and mind.'},
 {id:4,name:'Neon Grid',accent:'#69f0ae',bg:'#04120d',bg2:'#062018',deco:'#0a3326',
  hazard:'grid',boss:'Neon Overlord',dlc:'neon',
  enemies:['bitswarm','turret','glitchrunner','mainframe'],
  desc:'DLC: Infinite digital lattice. Electric grids overload flesh.'}
];

/* ===== ENEMIES ===== */
var ENEMIES={
 thornling:{hp:22,spd:52,r:14,dmg:11,xp:1,color:'#8bc34a',shape:'blob'},
 sprinter:{hp:14,spd:106,r:11,dmg:9,xp:1,color:'#cddc39',shape:'tri'},
 spitter:{hp:28,spd:40,r:15,dmg:9,xp:2,color:'#4caf50',shape:'diamond',ranged:{cd:2.0,spd:260,dmg:10,color:'#a5d6a7'}},
 brute:{hp:100,spd:33,r:25,dmg:20,xp:4,color:'#2e7d32',shape:'square'},
 emberling:{hp:26,spd:58,r:13,dmg:12,xp:1,color:'#ff8a65',shape:'blob'},
 hound:{hp:32,spd:120,r:14,dmg:14,xp:2,color:'#ff5722',shape:'tri'},
 flamespitter:{hp:38,spd:36,r:16,dmg:10,xp:2,color:'#ffb74d',shape:'diamond',ranged:{cd:1.7,spd:280,dmg:12,color:'#ffcc80'}},
 ashbrute:{hp:130,spd:30,r:27,dmg:24,xp:5,color:'#8d6e63',shape:'square'},
 frostling:{hp:32,spd:55,r:14,dmg:13,xp:1,color:'#4fc3f7',shape:'blob'},
 shardcaster:{hp:42,spd:38,r:16,dmg:11,xp:2,color:'#81d4fa',shape:'diamond',ranged:{cd:1.8,spd:310,dmg:13,color:'#b3e5fc'}},
 golem:{hp:165,spd:26,r:30,dmg:27,xp:6,color:'#546e7a',shape:'square'},
 wisp:{hp:22,spd:132,r:11,dmg:11,xp:2,color:'#e1f5fe',shape:'tri'},
 voidspawn:{hp:42,spd:62,r:15,dmg:15,xp:2,color:'#9575cd',shape:'blob'},
 rifteye:{hp:48,spd:34,r:17,dmg:12,xp:3,color:'#b388ff',shape:'diamond',ranged:{cd:1.5,spd:320,dmg:15,color:'#d1c4e9'}},
 nullwalker:{hp:36,spd:142,r:13,dmg:16,xp:3,color:'#7e57c2',shape:'tri'},
 devourer:{hp:210,spd:30,r:32,dmg:30,xp:7,color:'#4527a0',shape:'square'},
 bitswarm:{hp:28,spd:82,r:12,dmg:12,xp:2,color:'#69f0ae',shape:'blob'},
 turret:{hp:58,spd:20,r:17,dmg:13,xp:3,color:'#18ffff',shape:'diamond',ranged:{cd:1.2,spd:360,dmg:14,color:'#84ffff'}},
 glitchrunner:{hp:40,spd:152,r:13,dmg:17,xp:3,color:'#b2ff59',shape:'tri'},
 mainframe:{hp:250,spd:28,r:33,dmg:32,xp:8,color:'#00e676',shape:'square'}
};

/* ===== WEAPONS (with per-level upgrade descriptions) ===== */
var WEAPONS={

function handleTouchStart(e){ if(!e.target||e.target!==cv) return; for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i];
  if(TOUCH.moveId===null){ TOUCH.moveId=t.identifier; TOUCH.moveStartX=t.clientX; TOUCH.moveStartY=t.clientY; TOUCH.moveVecX=0; TOUCH.moveVecY=0; TOUCH.active=true; } } }

  for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i];
    if(t.identifier===TOUCH.moveId){ var dx=t.clientX-TOUCH.moveStartX, dy=t.clientY-TOUCH.moveStartY, len=Math.hypot(dx,dy);
      if(len>TOUCH.maxR){ TOUCH.moveStartX+=(dx/len)*(len-TOUCH.maxR); TOUCH.moveStartY+=(dy/len)*(len-TOUCH.maxR); dx=dx/len*TOUCH.maxR; dy=dy/len*TOUCH.maxR; }
      TOUCH.moveVecX=dx/TOUCH.maxR; TOUCH.moveVecY=dy/TOUCH.maxR; } }
  e.preventDefault(); }
function handleTouchEnd(e){ for(var i=0;i<e.changedTouches.length;i++){ if(e.changedTouches[i].identifier===TOUCH.moveId){ TOUCH.moveId=null; TOUCH.active=false; TOUCH.moveVecX=0; TOUCH.moveVecY=0; } } }

  S.revive = (pv.revives||0)+(m.revive||0);
  S.knock = 1.0;
  S.burnOn = (pv.burn||0)>0 ? (pv.burn||0)*5 : 0;

function hurt(e,dmg,opts){
  if(opts===undefined)opts={};
  if(!e||e.dead||!P) return;
  var crit=false; var cc=opts.critChance!==undefined?opts.critChance:P.stats.crit;
  if(opts.crit!==false && Math.random()<cc){ crit=true; dmg*=P.stats.critDmg; }
  if(e.chill>0) dmg*=(1+P.stats.chillBonus);
  if(e.burn>0 && opts.burnDmg) dmg*=(1+P.stats.burnBonus);
  dmg=Math.max(1,dmg);
  e.hp-=dmg; e.flash=0.12;
  G.texts.push({x:e.x+rand(-6,6),y:e.y-e.r-6,vx:rand(-18,18),vy:-52,life:0.7,t:0,text:Math.round(dmg),crit:crit,color:crit?'#ffd54f':'#ffffff',size:crit?17:13});
  if(opts.knock && !e.boss){ var a=Math.atan2(e.y-opts.fromY,e.x-opts.fromX); var k=opts.knock*P.stats.knock; e.x+=Math.cos(a)*k; e.y+=Math.sin(a)*k; }

  } else if(shape==='square'){

    g.beginPath(); g.moveTo(-r*0.55,r*0.45); g.lineTo(r*0.55,r*0.45); g.stroke();
    g.fillStyle='#ff1744'; g.shadowColor='#ff1744'; g.shadowBlur=10;
    g.beginPath(); g.arc(-r*0.3,-r*0.5,r*0.11,0,6.284); g.fill();
    g.beginPath(); g.arc(r*0.3,-r*0.5,r*0.11,0,6.284); g.fill();
    g.shadowBlur=0;
  } else if(shape==='diamond'){
    g.fillStyle=col;
    g.beginPath(); g.moveTo(0,-r*1.1); g.lineTo(r*0.7,-r*0.2);
    g.lineTo(r*0.5,r*0.7); g.lineTo(0,r*1.0); g.lineTo(-r*0.5,r*0.7); g.lineTo(-r*0.7,-r*0.2);
    g.closePath(); g.fill(); g.shadowBlur=0;
    g.fillStyle='rgba(255,255,255,.45)';
    g.beginPath(); g.moveTo(0,-r*0.6); g.lineTo(r*0.35,-r*0.1); g.lineTo(0,r*0.15); g.lineTo(-r*0.35,-r*0.1);
    g.closePath(); g.fill();
    var oa=t*2+e.wob;
    g.shadowColor=e.color; g.shadowBlur=12; g.fillStyle=e.color;
    g.beginPath(); g.arc(Math.cos(oa)*r*1.3,Math.sin(oa)*r*0.7,r*0.22,0,6.284); g.fill();
    g.shadowBlur=0;
  } else if(shape==='boss'){
    var spikes=12;
    g.shadowColor=e.color; g.shadowBlur=30;
    g.fillStyle=col;
    g.beginPath();
    for(var i2=0;i2<spikes*2;i2++){ var a2=i2/(spikes*2)*6.284+t*0.3;
      var rr2=(i2%2===0)?r*1.15:r*0.68;
      if(i2) g.lineTo(Math.cos(a2)*rr2,Math.sin(a2)*rr2); else g.moveTo(Math.cos(a2)*rr2,Math.sin(a2)*rr2); }
    g.closePath(); g.fill(); g.shadowBlur=0;
    g.fillStyle='rgba(0,0,0,.6)';
    g.beginPath(); g.arc(0,0,r*0.58,0,6.284); g.fill();
    g.shadowColor='#ff5252'; g.shadowBlur=20;
    g.fillStyle='#ff5252';
    g.beginPath(); g.arc(-r*0.26,-r*0.1,r*0.13,0,6.284); g.fill();
    g.beginPath(); g.arc(r*0.26,-r*0.1,r*0.13,0,6.284); g.fill();
    g.fillStyle='#ffeb3b';
    g.beginPath(); g.arc(-r*0.26,-r*0.1,r*0.05,0,6.284); g.fill();
    g.beginPath(); g.arc(r*0.26,-r*0.1,r*0.05,0,6.284); g.fill();
    g.shadowBlur=0;
  }
  g.restore();
  if(e.elite){
    g.save(); g.strokeStyle='#ffd54f'; g.lineWidth=2; g.globalAlpha=0.75;
    g.beginPath(); g.arc(x,y,r+5,0,6.284); g.stroke();
    g.globalAlpha=0.3; g.lineWidth=6;
    g.beginPath(); g.arc(x,y,r+5,0,6.284); g.stroke(); g.restore();
  }
  if(e.elite && e.hp<e.maxHp && !e.boss){
    var w=r*2.4,h=3;
    g.fillStyle='rgba(0,0,0,.7)'; g.fillRect(x-w/2,y-r-11,w,h);
    g.fillStyle='#ffd54f'; g.fillRect(x-w/2,y-r-11,w*(e.hp/e.maxHp),h);
  }
}

/* ===== BULLET SPRITE ===== */
function drawBulletSprite(g,b){
  var x=b.x,y=b.y,r=b.r,color=b.color;
  g.save(); g.shadowColor=color; g.shadowBlur=14; g.fillStyle=color;
  var shape=b.shape||'pulse'; var ang=Math.atan2(b.vy,b.vx);
  if(shape==='pulse'){ g.beginPath(); g.arc(x,y,r,0,6.284); g.fill();
    g.shadowBlur=0; g.fillStyle='#ffffff'; g.beginPath(); g.arc(x,y,r*0.5,0,6.284); g.fill(); }
  else if(shape==='pellet'){ g.beginPath(); g.arc(x,y,r,0,6.284); g.fill(); }
  else if(shape==='missile'){ g.translate(x,y); g.rotate(ang);
    g.beginPath(); g.moveTo(r*1.3,0); g.lineTo(-r,-r*0.6); g.lineTo(-r*0.5,0); g.lineTo(-r,r*0.6);
    g.closePath(); g.fill(); g.shadowBlur=0;
    g.fillStyle='#fff59d'; g.beginPath(); g.arc(r*0.4,0,r*0.35,0,6.284); g.fill(); }
  else if(shape==='disc'){ g.translate(x,y); g.rotate((b.t||0)*12);
    g.beginPath();
    for(var i=0;i<8;i++){ var a=i/8*6.284; var rr=(i%2===0)?r*1.2:r*0.7;
      if(i) g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); else g.moveTo(Math.cos(a)*rr,Math.sin(a)*rr); }
    g.closePath(); g.fill(); }
  else if(shape==='saw'){ g.translate(x,y); g.rotate((b.t||0)*15);
    g.beginPath();
    for(var i2=0;i2<12;i2++){ var a2=i2/12*6.284; var rr2=(i2%2===0)?r*1.25:r*0.75;
      if(i2) g.lineTo(Math.cos(a2)*rr2,Math.sin(a2)*rr2); else g.moveTo(Math.cos(a2)*rr2,Math.sin(a2)*rr2); }
    g.closePath(); g.fill(); g.shadowBlur=0;
    g.fillStyle='rgba(0,0,0,.4)'; g.beginPath(); g.arc(0,0,r*0.3,0,6.284); g.fill(); }
  else if(shape==='holy'){ g.beginPath(); g.arc(x,y,r,0,6.284); g.fill();
    g.shadowBlur=0; g.strokeStyle='#ffffff'; g.lineWidth=1.5;
    g.beginPath(); g.arc(x,y,r*0.7,0,6.284); g.stroke();
    g.fillStyle='#ffffff'; g.beginPath(); g.arc(x,y,r*0.35,0,6.284); g.fill(); }
  else if(shape==='arcane'){ g.translate(x,y); g.rotate((b.t||0)*6);
    g.beginPath();
    for(var i3=0;i3<4;i3++){ var a3=i3/4*6.284; var rr3=(i3%2===0)?r*1.2:r*0.5;
      if(i3) g.lineTo(Math.cos(a3)*rr3,Math.sin(a3)*rr3); else g.moveTo(Math.cos(a3)*rr3,Math.sin(a3)*rr3); }
    g.closePath(); g.fill(); }
  else if(shape==='flame'){ g.globalAlpha=0.85;
    g.beginPath(); g.arc(x,y,r*rand(0.8,1.2),0,6.284); g.fill();
    g.globalAlpha=0.5; g.fillStyle='#ffab40';
    g.beginPath(); g.arc(x,y,r*0.5,0,6.284); g.fill(); }
  else { g.beginPath(); g.arc(x,y,r,0,6.284); g.fill(); }
  g.restore();
}

/* ===== GAME START/END ===== */
function newGame(biomeId,mode,runTime){
  G={ biome:biomeId, mode:mode, time:0, runTime:runTime, kills:0, over:false, won:false,
    enemies:[], bullets:[], particles:[], pickups:[], zones:[], beams:[], texts:[],
    shake:0, boss:null, bossSpawned:false, spawnT:0.8, ebullets:[], nextBoss:240 };
  createPlayer(save.selectedChar||'vanguard');
  camX=P.x-W/2; camY=P.y-H/2; pendingLevels=0;
  $id('bossbar').classList.add('hide');
  updateWeaponHUD();
  state='playing'; showScreen(null); $id('hud').classList.remove('hide');
}
function endRun(won){
  if(state==='end'||state==='gameover'||!G) return;
  state='end'; G.won=won; var t=G.time;
  var soft,hard;
  if(G.mode==='endless'){ soft=Math.min(1800,Math.round(600+t*3+G.kills*0.8)); hard=clamp(3+Math.floor(t/120),3,10); }
  else { soft=Math.round(300+G.kills*1.2+(won?150:0)); hard=clamp(1+Math.floor(G.kills/250),1,3)+(won?1:0); }
  soft=Math.round(soft*(P.stats.greed||1)); hard=Math.max(1,Math.round(hard*(P.stats.fortune||1)));
  if(!save.devMode){ save.soft+=soft; save.hard+=hard; }
  save.runs++; save.kills+=G.kills;
  if(won){
    save.bossKills++;
    if(save.beaten.indexOf(G.biome)<0) save.beaten.push(G.biome);
    if(save.endless.indexOf(G.biome)<0) save.endless.push(G.biome);
    var next=G.biome+1;
    if(next<BIOMES.length && !BIOMES[next].dlc && save.biomes.indexOf(next)<0) save.biomes.push(next);
    else if(next<BIOMES.length && BIOMES[next].dlc && save.dlc.indexOf(BIOMES[next].dlc)>=0 && save.biomes.indexOf(next)<0) save.biomes.push(next);
  } else if(G.mode==='endless'){ if(save.endless.indexOf(G.biome)<0) save.endless.push(G.biome); }
  persist();
  $id('hud').classList.add('hide'); $id('bossbar').classList.add('hide');
  showEnd(soft,hard,won);
}

/* ===== UPDATE ===== */
function update(dt){
  G.time+=dt;
  var d=difficulty();
  var interval=Math.max(0.13,1.15-d*0.085);
  G.spawnT-=dt;
  if(G.spawnT<=0 && !G.bossSpawned){ G.spawnT=interval; spawnGroup(); }
  if(G.mode==='normal' && !G.bossSpawned && G.time>=G.runTime){ G.bossSpawned=true; spawnBoss(); }
  if(G.mode==='endless'){ if(G.time>=G.nextBoss){ G.nextBoss+=240; spawnBoss(); } }
  var mx=0,my=0;
  if(keys['a']||keys['arrowleft']) mx-=1;
  if(keys['d']||keys['arrowright']) mx+=1;
  if(keys['w']||keys['arrowup']) my-=1;
  if(keys['s']||keys['arrowdown']) my+=1;
  if(TOUCH.active){ mx += TOUCH.moveVecX; my += TOUCH.moveVecY; }
  var ml=Math.hypot(mx,my); var slow=hazardSlow();
  if(ml>1){ mx/=ml; my/=ml; ml=1; }
  if(ml>0.05){ P.aim=Math.atan2(my,mx); }
  P.x += mx*P.stats.speed*slow*dt;
  P.y += my*P.stats.speed*slow*dt;
  P.invuln=Math.max(0,P.invuln-dt);
  // Apply regen (handles negative values - Berserker's Oath drains HP)
  if(P.stats.regen!==0){
    P.hp = Math.min(P.maxHp, P.hp + P.stats.regen*dt);
    if(P.hp<=0 && state==='playing'){
      P.hp=0;
      if(P.revives>0){
        P.revives--; P.hp=P.maxHp*0.6; P.invuln=2.2;
        emitRing(P.x,P.y,30,'#ffd54f',20,300);
        msg('Phoenix revived you! ('+P.revives+' left)');
      } else { endRun(false); }
    }
  }
  camX += (P.x-W/2-camX)*Math.min(1,dt*7);
  camY += (P.y-H/2-camY)*Math.min(1,dt*7);
  G.shake*=Math.pow(0.001,dt);
  for(var wi=0;wi<P.weapons.length;wi++){
    var w=P.weapons[wi];
    var def=WEAPONS[w.id]||EVOLUTIONS[w.id];
    if(!def) continue;
    if(def.persistent){ def.update(w,dt); }
    else { w.t-=dt; if(w.t<=0){ w.t=wCd(w)/P.stats.haste; def.fire(w); } }
  }
  updateHazards(dt);
  // Player abilities from chest items
  updateAbilities(dt);
  // Bullets
  for(var bi=0;bi<G.bullets.length;bi++){
    var b=G.bullets[bi]; b.t+=dt;
    if(b.homing){
      if(!b.target||b.target.dead) b.target=nearestEnemy(b.x,b.y,700);
      if(b.target){
        var ta=Math.atan2(b.target.y-b.y,b.target.x-b.x);
        var ca=Math.atan2(b.vy,b.vx);
        var da=ta-ca; while(da>Math.PI)da-=Math.PI*2; while(da<-Math.PI)da+=Math.PI*2;
        var na=ca+clamp(da,-b.homing*dt,b.homing*dt);
        var sp=Math.hypot(b.vx,b.vy);
        b.vx=Math.cos(na)*sp; b.vy=Math.sin(na)*sp;
      }
    }
    if(b.boomerang){
      if(b.t>0.42 && !b.returning){ b.returning=true; b.hit.clear(); }
      if(b.returning){
        var ba=Math.atan2(P.y-b.y,P.x-b.x), bsp=760;
        b.vx+=Math.cos(ba)*bsp*dt*6; b.vy+=Math.sin(ba)*bsp*dt*6;
        var bs=Math.hypot(b.vx,b.vy); if(bs>bsp){ b.vx=b.vx/bs*bsp; b.vy=b.vy/bs*bsp; }
        if(dist(b.x,b.y,P.x,P.y)<26){ b.dead=true; }
      }
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt; if(b.life<=0) b.dead=true;
    if(b.flame){ if(Math.random()<0.6) G.particles.push({x:b.x,y:b.y,vx:rand(-30,30),vy:rand(-30,30),life:0.32,max:0.32,r:rand(3,7),color:'#ff8a65'}); }
    else if(Math.random()<0.35){ G.particles.push({x:b.x,y:b.y,vx:0,vy:0,life:0.2,max:0.2,r:b.r*0.6,color:b.color}); }
    for(var ei=0;ei<G.enemies.length;ei++){
      var e=G.enemies[ei]; if(e.dead||b.dead) continue; if(b.hit.has(e)) continue;
      var rr=b.r+e.r;
      if((e.x-b.x)*(e.x-b.x)+(e.y-b.y)*(e.y-b.y) < rr*rr){
        b.hit.add(e);
        hurt(e,b.dmg,{fromX:b.x,fromY:b.y,knock:b.knock});
        if(b.burn) e.burn=Math.max(e.burn,b.burn);
        emit(b.x,b.y,3,b.color,120,0.3,3);
        if(b.ricochet){
          var rt=nearestEnemy(b.x,b.y,600,e);
          var ra=rt?Math.atan2(rt.y-b.y,rt.x-b.x):rand(0,6.28);
          var rs=Math.hypot(b.vx,b.vy)||480;
          b.vx=Math.cos(ra)*rs; b.vy=Math.sin(ra)*rs;
          b.life=Math.max(b.life,1.6);
        } else { b.pierce--; if(b.pierce<0){ b.dead=true; break; } }
      }
    }
  }
  G.bullets=G.bullets.filter(function(b){return !b.dead;});
  for(var ebi=0;ebi<G.ebullets.length;ebi++){
    var eb=G.ebullets[ebi]; eb.x+=eb.vx*dt; eb.y+=eb.vy*dt; eb.life-=dt;
    if(eb.life<=0){ eb.dead=true; continue; }
    if(dist(eb.x,eb.y,P.x,P.y)<eb.r+P.r){ eb.dead=true; damagePlayer(eb.dmg); }
  }
  G.ebullets=G.ebullets.filter(function(b){return !b.dead;});
  for(var zi=0;zi<G.zones.length;zi++){
    var z=G.zones[zi]; z.t+=dt;
    if(z.ring){
      z.r = z.maxR*Math.min(1,z.t/z.life);
      for(var zei=0;zei<G.enemies.length;zei++){
        var ze=G.enemies[zei]; if(ze.dead||z.hit.has(ze)) continue;
        var zdd=dist(ze.x,ze.y,z.x,z.y);
        if(zdd < z.r+ze.r && zdd > z.r-ze.r-30){
          z.hit.add(ze);
          hurt(ze,z.dmg,{fromX:z.x,fromY:z.y,knock:16});
          if(z.slow) ze.chill=Math.max(ze.chill||0,z.slow);
          if(z.burn) ze.burn=Math.max(ze.burn||0,z.burn);
        }
      }
      if(z.t>=z.life) z.dead=true;
    } else if(z.mine){
      if(z.t>=z.life){ z.dead=true; continue; }
      for(var mei=0;mei<G.enemies.length;mei++){ var me=G.enemies[mei]; if(me.dead)continue;
        if(dist(me.x,me.y,z.x,z.y)<z.r+me.r){ z.dead=true; explode(z.x,z.y,z.blastR,z.dmg,z.color); break; } }
    } else if(z.rune){
      if(z.t>=z.life){ z.dead=true; explode(z.x,z.y,z.blastR,z.dmg,z.color); }
    } else if(z.pull){
      for(var pei=0;pei<G.enemies.length;pei++){ var pe=G.enemies[pei]; if(pe.dead||pe.boss)continue;
        var pdd=dist(pe.x,pe.y,z.x,z.y);
        if(pdd<z.r*1.6 && pdd>1){
          var pa=Math.atan2(z.y-pe.y,z.x-pe.x);
          var pf=z.pull*(1-pdd/(z.r*1.6));
          pe.x+=Math.cos(pa)*pf*dt; pe.y+=Math.sin(pa)*pf*dt;
        } }
      z.tickT-=dt;
      if(z.tickT<=0){ z.tickT=z.tick;
        var zlist=enemiesInRadius(z.x,z.y,z.r);
        for(var zli=0;zli<zlist.length;zli++) hurt(zlist[zli],z.dmg,{fromX:z.x,fromY:z.y}); }
      if(z.t>=z.life) z.dead=true;
    } else if(z.dot){
      z.tickT-=dt;
      if(z.tickT<=0){ z.tickT=z.tick;
        var dlist=enemiesInRadius(z.x,z.y,z.r);
        for(var dli=0;dli<dlist.length;dli++) hurt(dlist[dli],z.dmg,{fromX:z.x,fromY:z.y});
        emit(z.x+rand(-z.r,z.r),z.y+rand(-z.r,z.r),1,z.color,40,0.6,4); }
      if(z.t>=z.life) z.dead=true;
    } else { if(z.t>=z.life) z.dead=true; }
  }
  G.zones=G.zones.filter(function(z){return !z.dead;});
  for(var bmi=0;bmi<G.beams.length;bmi++){ G.beams[bmi].t+=dt; if(G.beams[bmi].t>=G.beams[bmi].life) G.beams[bmi].dead=true; }
  G.beams=G.beams.filter(function(b){return !b.dead;});
  for(var eni=0;eni<G.enemies.length;eni++){
    var en=G.enemies[eni]; if(en.dead) continue;
    en.flash=Math.max(0,en.flash-dt);
    if(en.spawnAnim>0) en.spawnAnim-=dt;
    if(en.burn>0){ en.burn-=dt; en.burnT-=dt;
      if(en.burnT<=0){ en.burnT=0.5; en.hp-=(P.stats.burnOn||3);
        G.texts.push({x:en.x,y:en.y-10,vx:0,vy:-40,life:0.5,t:0,text:Math.round(P.stats.burnOn||3),color:'#ff7043',size:12});
        if(en.hp<=0){ killEnemy(en); continue; } } }
    if(en.chill>0){ en.chill-=dt; }
    var slowMul = en.chill>0?0.5:1;
    if(en.boss){ bossAttack(en,dt); }
    else {
      var ena=Math.atan2(P.y-en.y,P.x-en.x);
      en.x+=Math.cos(ena)*en.spd*slowMul*dt;
      en.y+=Math.sin(ena)*en.spd*slowMul*dt;
      if(en.ranged){
        en.shootT-=dt;
        if(en.shootT<=0 && dist(en.x,en.y,P.x,P.y)<620){
          en.shootT=en.ranged.cd;
          var esa=Math.atan2(P.y-en.y,P.x-en.x);
          G.ebullets.push({x:en.x,y:en.y,vx:Math.cos(esa)*en.ranged.spd,vy:Math.sin(esa)*en.ranged.spd,
            dmg:en.ranged.dmg*(1+difficulty()*0.15),r:6,color:en.ranged.color,life:4});
        }
      }
    }
    if(dist(en.x,en.y,P.x,P.y) < en.r+P.r){ damagePlayer(en.dmg); }
    if(!en.boss && Math.random()<0.35){
      for(var oi=0;oi<G.enemies.length;oi++){
        var o=G.enemies[oi]; if(o===en||o.dead||o.boss) continue;
        var dx=o.x-en.x, dy=o.y-en.y, d2=dx*dx+dy*dy; var orr=en.r+o.r;
        if(d2<orr*orr && d2>0.01){ var odd=Math.sqrt(d2), push=(orr-odd)*0.5;
          en.x-=dx/odd*push*0.5; en.y-=dy/odd*push*0.5; }
      }
    }
  }
  G.enemies=G.enemies.filter(function(e){return !e.dead;});
  for(var pi=0;pi<G.pickups.length;pi++){
    var p=G.pickups[pi]; p.t+=dt; var pd=dist(p.x,p.y,P.x,P.y);
    if(pd<P.stats.pickup){
      var ppa=Math.atan2(P.y-p.y,P.x-p.x);
      var pull=Math.min(520, 120+ (P.stats.pickup-pd)*4);
      p.vx+=Math.cos(ppa)*pull*dt*4; p.vy+=Math.sin(ppa)*pull*dt*4;
    }
    p.vx*=0.94; p.vy*=0.94; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(pd<P.r+p.r){
      p.dead=true;
      if(p.type==='xp') gainXp(p.val);
      else if(p.type==='hp'){ heal(p.val); emit(P.x,P.y,8,'#66bb6a',140); }
      else if(p.type==='chest'){ openChest(); }
    }
  }
  G.pickups=G.pickups.filter(function(p){return !p.dead;});
  for(var pti=0;pti<G.particles.length;pti++){
    var pt=G.particles[pti]; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt;
    pt.vx*=0.94; pt.vy*=0.94; pt.life-=dt;
  }
  G.particles=G.particles.filter(function(p){return p.life>0;});
  for(var ti=0;ti<G.texts.length;ti++){ var t2=G.texts[ti]; t2.t+=dt; t2.x+=t2.vx*dt; t2.y+=t2.vy*dt; t2.vy+=60*dt; }
  G.texts=G.texts.filter(function(t3){return t3.t<t3.life;});
  updateHUD();
}

/* ===== ABILITIES from chest items ===== */
function updateAbilities(dt){
  if(!P.abilities) return;
  for(var i=0;i<P.abilities.length;i++){
    var a=P.abilities[i];
    if(a.type==='lightningAura'){
      a.t-=dt;
      if(a.t<=0){ a.t=a.cd;
        var list=enemiesInRadius(P.x,P.y,a.radius);
        if(list.length){
          var target=list[randInt(0,list.length-1)];
          G.beams.push({x1:P.x,y1:P.y,x2:target.x,y2:target.y,life:0.15,t:0,color:'#4fc3f7',w:3});
          hurt(target,a.dmg*P.stats.dmg,{fromX:P.x,fromY:P.y});
        }
      }
    } else if(a.type==='poisonAura'){
      a.t-=dt;
      if(a.t<=0){ a.t=a.cd;
        var list2=enemiesInRadius(P.x,P.y,a.radius);
        for(var j=0;j<list2.length;j++) hurt(list2[j],a.dmg*P.stats.dmg,{fromX:P.x,fromY:P.y});
      }
    } else if(a.type==='freezeField'){
      var list3=enemiesInRadius(P.x,P.y,a.radius);
      for(var k=0;k<list3.length;k++){ list3[k].chill=Math.max(list3[k].chill||0, 0.5); }
    } else if(a.type==='fireRing'){
      a.t=(a.t||0)+dt;
      var R=a.r;
      var list4=enemiesInRadius(P.x,P.y,R+8);
      for(var m=0;m<list4.length;m++){
        var e=list4[m]; var d=dist(e.x,e.y,P.x,P.y);
        if(d>R-8 && d<R+8){
          var key=e._fireRingHit||0;
          if(a.t-key>0.3){ e._fireRingHit=a.t; hurt(e,10*P.stats.dmg,{fromX:P.x,fromY:P.y}); }
        }
      }
    } else if(a.type==='windPush'){
      var list5=enemiesInRadius(P.x,P.y,a.radius);
      for(var n=0;n<list5.length;n++){
        var e2=list5[n]; if(e2.boss) continue;
        var ang2=Math.atan2(e2.y-P.y, e2.x-P.x);
        e2.x+=Math.cos(ang2)*a.force*dt;
        e2.y+=Math.sin(ang2)*a.force*dt;
      }
    } else if(a.type==='timeSlow'){
      var list6=enemiesInRadius(P.x,P.y,a.radius);
      for(var o=0;o<list6.length;o++){ list6[o].chill=Math.max(list6[o].chill||0,0.3); }
    } else if(a.type==='shockwave'){
      a.t-=dt;
      if(a.t<=0){ a.t=a.cd;
        spawnZone({x:P.x,y:P.y,r:8,maxR:a.radius,life:0.4,dmg:a.dmg*P.stats.dmg,
          color:'#ffca28',ring:true,hit:new Set()});
        emitRing(P.x,P.y,20,'#ffca28',20,320);
      }
    }
  }
}

function explode(x,y,r,dmg,color){
  spawnZone({x:x,y:y,r:6,maxR:r,life:0.32,dmg:dmg,color:color,ring:true,hit:new Set()});
  emitRing(x,y,18,color,10,320); G.shake=Math.max(G.shake,5);
}

/* ===== HAZARDS ===== */
function hazardAt(biome,cx,cy){
  var h=hash2(cx*7.13,cy*3.71); if(h<0.86) return null;
  var r=hash2(cx*1.7,cy*9.3);
  return {x:cx*300+80+r*140, y:cy*300+80+hash2(cy,cx)*140, r:52+r*36, type:BIOMES[biome].hazard};
}
function updateHazards(dt){
  var CH=300;
  var x0=Math.floor((P.x-W/2)/CH)-1, x1=Math.floor((P.x+W/2)/CH)+1;
  var y0=Math.floor((P.y-H/2)/CH)-1, y1=Math.floor((P.y+H/2)/CH)+1;
  for(var i=x0;i<=x1;i++) for(var j=y0;j<=y1;j++){
    var h=hazardAt(G.biome,i,j); if(!h) continue;
    if(P.invuln<=0 && dist(P.x,P.y,h.x,h.y)<h.r+P.r){
      var t=h.type;
      if(t==='lava') damagePlayer(9*dt*8);
      else if(t==='void') damagePlayer(7*dt*8);
      else if(t==='grid') damagePlayer(8*dt*8);
    }
  }
}
function hazardSlow(){
  var CH=300;
  var x0=Math.floor((P.x-W/2)/CH)-1, x1=Math.floor((P.x+W/2)/CH)+1;
  var y0=Math.floor((P.y-H/2)/CH)-1, y1=Math.floor((P.y+H/2)/CH)+1;
  for(var i=x0;i<=x1;i++) for(var j=y0;j<=y1;j++){
    var h=hazardAt(G.biome,i,j); if(!h)continue;
    if(dist(P.x,P.y,h.x,h.y)<h.r+P.r){ if(h.type==='ice'||h.type==='thorn') return 0.55; }
  }
  return 1;
}

/* ===== PLAYER ===== */
function createPlayer(charId){
  var c=CHARACTERS.filter(function(x){return x.id===charId;})[0]||CHARACTERS[0];
  P={ char:c, x:0,y:0, r:14, aim:0,
    level:1, xp:0, xpNext:6,
    weapons:[], passives:{}, invuln:0, hp:100, maxHp:100, stats:null,
    revives:0, kills:0, dmgTaken:0, abilities:[], bonuses:{},
    bonusMaxHp:0,bonusDmg:0,bonusHaste:0,bonusSpeed:0,bonusRegen:0,bonusArmor:0,
    bonusMagnet:0,bonusXp:0,bonusCrit:0,bonusCritDmg:0,bonusLifesteal:0,bonusPierce:0,
    bonusGreed:0,bonusFortune:0,bonusMulti:0,bonusKillHeal:0,
    dmgTakenMul:1,maxHpMul:1,speedMul:1
  };
  addWeapon(c.weapon);
  recalcStats();
  P.revives = P.stats.revive;
  P.hp=P.maxHp;
}
function addWeapon(id){
  var def=WEAPONS[id]; if(!def||!P) return;
  if(P.weapons.some(function(w){return w.id===id;})) return;
  if(P.weapons.length>=6) return;
  var w={id:id,lvl:1,t:0};
  if(def.persistent){ w.ang=0; w.tick=0; w.fireT=0; }
  P.weapons.push(w); updateWeaponHUD();
}
function wDmg(w){
  var def=WEAPONS[w.id]||EVOLUTIONS[w.id];
  return def.base.dmg*(1+0.35*(w.lvl-1));
}
function wCd(w){
  var def=WEAPONS[w.id]||EVOLUTIONS[w.id];
  return Math.max(0.06, def.base.cd*Math.pow(0.92,w.lvl-1));
}
function gainXp(n){
  if(!P) return;
  P.xp += n*P.stats.xpMul;
  while(P.xp>=P.xpNext){
    P.xp-=P.xpNext; P.level++;
    P.xpNext=Math.floor(6+P.level*3.4+P.level*P.level*0.30);
    pendingLevels++;
  }
  if(pendingLevels>0 && state==='playing') openLevelUp();
}
function heal(n){ if(P) P.hp=Math.min(P.maxHp,P.hp+n); }
function damagePlayer(a){
  if(state!=='playing'||!P||P.invuln>0) return;
  if(Math.random()<P.stats.dodge){
    G.texts.push({x:P.x,y:P.y-30,vx:0,vy:-60,life:0.7,t:0,text:'DODGE',color:'#80cbc4',size:14});
    P.invuln=0.2; return;
  }
  a=Math.max(1,a-P.stats.armor);
  a*=(P.dmgTakenMul||1);
  P.hp-=a; P.dmgTaken+=a;
  P.invuln=0.38; G.shake=7;
  emit(P.x,P.y,6,'#e53935',160);
  if(P.hp<=0){
    if(P.revives>0){
      P.revives--; P.hp=P.maxHp*0.6; P.invuln=2.2;
      emitRing(P.x,P.y,30,'#ffd54f',20,300);
      msg('Phoenix revived you! ('+P.revives+' left)');
    } else { endRun(false); }
  }
}

/* ===== HUD ===== */
function updateWeaponHUD(){
  var el=$id('weapons'); if(!el) return;
  el.innerHTML=''; if(!P) return;
  for(var i=0;i<P.weapons.length;i++){
    var w=P.weapons[i];
    var isEvo = !!EVOLUTIONS[w.id];
    var def = WEAPONS[w.id]||EVOLUTIONS[w.id];
    var d=document.createElement('div');
    d.className='wslot'+(w.lvl>=MAX_LVL&&!isEvo?' max':'')+(isEvo?' evo':'');
    d.style.borderColor=def.color;
    d.style.color=def.color;
    d.innerHTML=def.short+(isEvo?'':'<i>'+w.lvl+'</i>');
    el.appendChild(d);
  }
}
function updateHUD(){
  if(!P||!G) return;
  var hpPct=clamp(P.hp/P.maxHp,0,1);
  var hpbar=document.querySelector('#hpbar>i'), hpspan=document.querySelector('#hpbar>span');
  if(hpbar) hpbar.style.width=(hpPct*100)+'%';
  if(hpspan) hpspan.textContent=Math.ceil(Math.max(0,P.hp))+'/'+Math.round(P.maxHp);
  var xpbar=document.querySelector('#xpbar>i'), xpspan=document.querySelector('#xpbar>span');
  if(xpbar) xpbar.style.width=clamp(P.xp/P.xpNext,0,1)*100+'%';
  if(xpspan) xpspan.textContent='LV '+P.level;
  var lv=$id('hudlv'); if(lv) lv.textContent=P.level;
  var kk=$id('hudkills'); if(kk) kk.textContent=G.kills;
  var ss=$id('hudsoft'); if(ss) ss.textContent=save.soft;
  var tt=$id('timer');
  if(tt){
    if(G.mode==='endless') tt.textContent=fmtTime(G.time);
    else { var left=G.runTime-G.time; tt.textContent = G.bossSpawned? 'BOSS' : fmtTime(left); }
  }
  if(G.boss){ var bb=document.querySelector('#bossbar .bar>i'); if(bb) bb.style.width=clamp(G.boss.hp/G.boss.maxHp,0,1)*100+'%'; }
}

/* ===== LEVEL UP + FUSION ===== */
function availableFusions(){
  var out=[];
  for(var i=0;i<P.weapons.length;i++){
    for(var j=i+1;j<P.weapons.length;j++){
      var a=P.weapons[i], b=P.weapons[j];
      if(a.lvl<MAX_LVL || b.lvl<MAX_LVL) continue;
      if(EVOLUTIONS[a.id]||EVOLUTIONS[b.id]) continue;
      for(var k=0;k<FUSIONS.length;k++){
        var f=FUSIONS[k];
        if((f.a===a.id && f.b===b.id)||(f.a===b.id && f.b===a.id)){
          out.push({a:a,b:b,result:f.result});
          break;
        }
      }
    }
  }
  return out;
}
function rollChoices(){
  var pool=[];
  // Weapons
  for(var i=0;i<P.weapons.length;i++){
    var w=P.weapons[i];
    if(EVOLUTIONS[w.id]) continue;
    if(w.lvl<MAX_LVL){
      var desc=WEAPONS[w.id].levelUps[w.lvl-1];
      pool.push({kind:'wup',id:w.id,
        title:WEAPONS[w.id].name,
        lvlText:'Level '+(w.lvl+1)+' / '+MAX_LVL,
        gain:desc,
        desc:WEAPONS[w.id].desc,color:WEAPONS[w.id].color});
    }
  }
  if(P.weapons.length<6){
    for(var j=0;j<WEAPON_IDS.length;j++){
      var id=WEAPON_IDS[j];
      if(save.weapons.indexOf(id)>=0 && !P.weapons.some(function(ww){return ww.id===id;})){
        pool.push({kind:'wnew',id:id,title:'NEW · '+WEAPONS[id].name,
          lvlText:'Weapon',
          gain:'Base: '+WEAPONS[id].base.dmg+' dmg / '+WEAPONS[id].base.cd+'s',
          desc:WEAPONS[id].desc,color:WEAPONS[id].color});
      }
    }
  }
  // Passives
  for(var pid in PASSIVES){
    var cur=P.passives[pid]||0;
    if(cur<PASSIVES[pid].max){
      pool.push({kind:'pass',id:pid,title:PASSIVES[pid].name+' ('+(cur+1)+'/'+PASSIVES[pid].max+')',
        lvlText:'Passive',
        gain:PASSIVES[pid].desc(cur+1),
        desc:'', color:'#7ee0a8'});
    }
  }
  if(pool.length<3) pool.push({kind:'heal',title:'Field Rations',
    lvlText:'Consumable', gain:'Restore 40% of your Max HP', desc:'', color:'#66bb6a'});
  shuffle(pool);
  var out=[]; var seen=new Set();
  for(var k=0;k<pool.length;k++){
    var c=pool[k]; var key=c.kind+':'+c.id;
    if(seen.has(key)) continue;
    seen.add(key); out.push(c);
    if(out.length>=3) break;
  }
  return out;
}
function openLevelUp(){
  if(state!=='playing'||!P) return;
  state='levelup';
  var choices=rollChoices();
  var el=$id('s-levelup');
  el.innerHTML='<h2>Level '+P.level+'</h2><div class="sub">Choose an upgrade</div><div class="row" id="lvlcards"></div>';
  var cards=$id('lvlcards');
  for(var i=0;i<choices.length;i++){
    (function(c){
      var d=document.createElement('div');
      d.className='ucard';
      d.innerHTML='<div class="lvl">'+c.lvlText+'</div>'+
        '<h4 style="color:'+c.color+'">'+c.title+'</h4>'+
        '<div class="gain">'+c.gain+'</div>'+
        (c.desc?'<div class="desc">'+c.desc+'</div>':'');
      d.onclick=function(){ applyChoice(c); };
      cards.appendChild(d);
    })(choices[i]);
  }
  showScreen('s-levelup');
}
function applyChoice(c){
  if(c.kind==='wup'){ var w=P.weapons.filter(function(x){return x.id===c.id;})[0]; if(w) w.lvl++; }
  else if(c.kind==='wnew'){ addWeapon(c.id); }
  else if(c.kind==='pass'){ P.passives[c.id]=(P.passives[c.id]||0)+1; recalcStats(); P.hp=Math.min(P.hp,P.maxHp); }
  else if(c.kind==='heal'){ heal(P.maxHp*0.4); }
  pendingLevels--;
  updateWeaponHUD();
  // Check for available fusions first
  var fusions=availableFusions();
  if(fusions.length>0){ showFusionChoice(fusions); return; }
  if(pendingLevels>0){ openLevelUp(); }
  else { state='playing'; showScreen(null); }
}
function showFusionChoice(fusions){
  state='fuse';
  var el=$id('s-fuse');
  el.innerHTML='<h2>Weapon Evolution Available!</h2>'+
    '<div class="sub">Two level-8 weapons can be merged into a powerful evolution. The originals will be consumed.</div>'+
    '<div class="row" id="fusecards"></div>'+
    '<div style="margin-top:16px"><button class="small" id="skipFuse">Skip (keep weapons)</button></div>';
  var row=$id('fusecards');
  for(var i=0;i<fusions.length;i++){
    (function(fu){
      var evo=EVOLUTIONS[fu.result];
      var d=document.createElement('div');
      d.className='ucard';
      d.style.borderColor='#b388ff';
      d.innerHTML='<div class="lvl" style="color:#b388ff">FUSION</div>'+
        '<h4 style="color:'+evo.color+'">'+evo.name+'</h4>'+
        '<div class="gain" style="color:#e1bee7;background:rgba(80,40,140,.5);border-color:#b388ff">'+
        WEAPONS[fu.a.id].name+' + '+WEAPONS[fu.b.id].name+' → '+evo.name+'</div>'+
        '<div class="desc">'+evo.desc+'</div>';
      d.onclick=function(){ doFusion(fu); };
      row.appendChild(d);
    })(fusions[i]);
  }
  $id('skipFuse').onclick=function(){
    if(pendingLevels>0){ openLevelUp(); }
    else { state='playing'; showScreen(null); }
  };
  showScreen('s-fuse');
}
function doFusion(fu){
  // Remove the two weapons
  P.weapons=P.weapons.filter(function(w){ return w!==fu.a && w!==fu.b; });
  // Add the evolution at level 1
  var evo=EVOLUTIONS[fu.result];
  var w={id:fu.result,lvl:1,t:0};
  if(evo.persistent){ w.ang=0; w.tick=0; w.fireT=0; }
  P.weapons.push(w);
  if(save.fusionsSeen.indexOf(fu.result)<0) save.fusionsSeen.push(fu.result);
  persist();
  emitRing(P.x,P.y,40,'#b388ff',20,400);
  emit(P.x,P.y,30,'#b388ff',280,1.0,6);
  G.shake=20;
  msg('⚡ Fusion: '+evo.name+'!');
  updateWeaponHUD();
  if(pendingLevels>0){ openLevelUp(); }
  else { state='playing'; showScreen(null); }
}

/* ===== PREVIEW RENDERING ===== */
function drawPreviewChar(canvas, charId){
  var g=canvas.getContext('2d');
  var w=canvas.width, h=canvas.height;
  g.clearRect(0,0,w,h);
  var grd=g.createRadialGradient(w/2,h/2,5,w/2,h/2,w/2);
  grd.addColorStop(0,'rgba(30,50,70,0.6)'); grd.addColorStop(1,'rgba(5,10,15,0.95)');
  g.fillStyle=grd; g.fillRect(0,0,w,h);
  drawCharSprite(g, charId, w/2, h/2+6, -Math.PI/2, Math.min(w,h)*0.30, 0.8);
}
function drawPreviewWeapon(canvas, weaponId){
  var g=canvas.getContext('2d');
  var w=canvas.width, h=canvas.height;
  g.clearRect(0,0,w,h);
  var grd=g.createRadialGradient(w/2,h/2,5,w/2,h/2,w/2);
  grd.addColorStop(0,'rgba(30,50,70,0.6)'); grd.addColorStop(1,'rgba(5,10,15,0.95)');
  g.fillStyle=grd; g.fillRect(0,0,w,h);
  var def=WEAPONS[weaponId]||EVOLUTIONS[weaponId];
  var color=def.color;
  g.save(); g.translate(w/2,h/2);
  g.shadowColor=color; g.shadowBlur=16; g.fillStyle=color;
  var id=weaponId;
  if(id==='pulseRifle'){ for(var i=0;i<3;i++){ g.beginPath(); g.arc(-20+i*20,0,5,0,6.284); g.fill(); } }
  else if(id==='scattergun'){ for(var a=-0.6;a<=0.6;a+=0.3){ g.save(); g.rotate(a); g.beginPath(); g.arc(15,0,4,0,6.284); g.fill(); g.restore(); } g.beginPath(); g.arc(0,0,7,0,6.284); g.fill(); }
  else if(id==='orbitBlades'){ for(var k=0;k<4;k++){ var ang=k/4*6.284; g.save(); g.translate(Math.cos(ang)*22,Math.sin(ang)*22); g.rotate(ang); g.beginPath(); g.moveTo(0,-8); g.lineTo(8,0); g.lineTo(0,8); g.lineTo(-8,0); g.closePath(); g.fill(); g.restore(); } }
  else if(id==='chainLightning'){ g.strokeStyle=color; g.lineWidth=3; g.lineCap='round'; g.beginPath(); g.moveTo(-25,-15); g.lineTo(-5,-5); g.lineTo(5,10); g.lineTo(15,-5); g.lineTo(25,15); g.stroke(); }
  else if(id==='flamethrower'){ for(var f=0;f<5;f++){ g.globalAlpha=1-f*0.15; g.fillStyle=f<2?'#ffab40':'#ff7043'; g.beginPath(); g.arc(-8+f*7,0,10-f,0,6.284); g.fill(); } g.globalAlpha=1; }
  else if(id==='frostNova'){ g.strokeStyle=color; g.lineWidth=3; g.beginPath(); g.arc(0,0,22,0,6.284); g.stroke(); g.beginPath(); g.arc(0,0,12,0,6.284); g.stroke(); g.beginPath(); g.arc(0,0,4,0,6.284); g.fill(); }
  else if(id==='homingMissiles'){ for(var mi=0;mi<3;mi++){ g.save(); g.rotate(-0.5+mi*0.5); g.beginPath(); g.moveTo(18,0); g.lineTo(-8,-5); g.lineTo(-4,0); g.lineTo(-8,5); g.closePath(); g.fill(); g.restore(); } }
  else if(id==='laserBeam'){ g.fillRect(-25,-4,50,8); g.fillStyle='#fff'; g.fillRect(-25,-1.5,50,3); }
  else if(id==='boomerang'){ g.save(); g.rotate(0.5); g.beginPath(); g.arc(0,0,22,-0.9,0.9); g.arc(0,0,14,0.9,-0.9,true); g.closePath(); g.fill(); g.restore(); }
  else if(id==='mineLayer'){ g.beginPath(); g.arc(0,0,10,0,6.284); g.fill(); for(var sp=0;sp<8;sp++){ var sa=sp/8*6.284; g.beginPath(); g.moveTo(Math.cos(sa)*10,Math.sin(sa)*10); g.lineTo(Math.cos(sa)*18,Math.sin(sa)*18); g.stroke(); } }
  else if(id==='poisonCloud'){ for(var cl=0;cl<4;cl++){ g.globalAlpha=0.5; g.beginPath(); g.arc(-12+cl*8,Math.sin(cl*2)*6,12,0,6.284); g.fill(); } g.globalAlpha=1; }
  else if(id==='holyOrb'){ g.beginPath(); g.arc(0,0,8,0,6.284); g.fill(); g.strokeStyle=color; g.lineWidth=2; g.beginPath(); g.arc(0,0,20,0,6.284); g.stroke(); g.beginPath(); g.arc(20,0,4,0,6.284); g.fill(); }

  else if(id==='sawBlade'){ for(var st=0;st<12;st++){ var sa2=st/12*6.284; var rr=(st%2===0)?22:13; g.beginPath(); g.moveTo(Math.cos(sa2)*rr,Math.sin(sa2)*rr); g.lineTo(Math.cos(sa2+0.26)*rr,Math.sin(sa2+0.26)*rr); g.lineTo(0,0); g.closePath(); } g.beginPath(); g.arc(0,0,22,0,6.284); g.fill(); g.fillStyle='rgba(0,0,0,.5)'; g.beginPath(); g.arc(0,0,6,0,6.284); g.fill(); }
  else if(id==='blackhole'){ var grd2=g.createRadialGradient(0,0,0,0,0,22); grd2.addColorStop(0,'#000'); grd2.addColorStop(0.5,color); grd2.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=grd2; g.beginPath(); g.arc(0,0,22,0,6.284); g.fill(); }
  else if(id==='teslaCoil'){ g.strokeStyle=color; g.lineWidth=2; for(var tc=0;tc<3;tc++){ g.beginPath(); g.arc(0,0,8+tc*6,0,6.284); g.stroke(); } g.beginPath(); g.arc(0,0,6,0,6.284); g.fill(); }
  else if(id==='runeTrap'){ g.strokeStyle=color; g.lineWidth=2; g.beginPath(); for(var rn=0;rn<6;rn++){ var rna=rn/6*6.284-Math.PI/2; var rnr=20; if(rn) g.lineTo(Math.cos(rna)*rnr,Math.sin(rna)*rnr); else g.moveTo(Math.cos(rna)*rnr,Math.sin(rna)*rnr); } g.closePath(); g.stroke(); }
  else if(id==='spiritWolf'){ g.beginPath(); g.moveTo(-18,-4); g.lineTo(-10,-18); g.lineTo(-4,-8); g.lineTo(8,-8); g.lineTo(14,-18); g.lineTo(20,-2); g.lineTo(12,12); g.lineTo(-6,12); g.closePath(); g.fill(); g.fillStyle='#0a0a0a'; g.beginPath(); g.arc(-5,-2,2,0,6.284); g.fill(); g.beginPath(); g.arc(6,-2,2,0,6.284); g.fill(); }
  else if(id==='arcaneMissiles'){ for(var am=0;am<5;am++){ var ama=am/5*6.284; g.beginPath(); g.arc(Math.cos(ama)*18,Math.sin(ama)*18,4,0,6.284); g.fill(); } g.beginPath(); g.arc(0,0,6,0,6.284); g.fill(); }
  else if(id==='sunburst'){ g.beginPath(); g.arc(0,0,20,0,6.284); g.fill(); g.fillStyle='#fff59d'; g.beginPath(); g.arc(0,0,12,0,6.284); g.fill(); g.strokeStyle=color; g.lineWidth=3; for(var sb=0;sb<8;sb++){ var sba=sb/8*6.284; g.beginPath(); g.moveTo(Math.cos(sba)*20,Math.sin(sba)*20); g.lineTo(Math.cos(sba)*28,Math.sin(sba)*28); g.stroke(); } }
  else if(EVOLUTIONS[id]){ // Evolutions
    var ev=EVOLUTIONS[id];
    if(id==='stormCannon'){ g.shadowBlur=20; for(var i2=0;i2<3;i2++){ g.beginPath(); g.arc(-15+i2*15,0,7,0,6.284); g.fill(); } g.strokeStyle='#81d4fa'; g.lineWidth=2; g.beginPath(); g.moveTo(-25,-12); g.lineTo(25,12); g.stroke(); }
    else if(id==='dragonBreath'){ for(var d2=0;d2<6;d2++){ g.globalAlpha=1-d2*0.13; g.fillStyle=d2<2?'#ffeb3b':'#ff5722'; g.beginPath(); g.arc(-10+d2*7,Math.sin(d2)*4,11-d2,0,6.284); g.fill(); } g.globalAlpha=1; }
    else if(id==='vortexSaws'){ g.shadowBlur=22; for(var v2=0;v2<6;v2++){ var va2=v2/6*6.284; g.save(); g.translate(Math.cos(va2)*18,Math.sin(va2)*18); g.rotate(va2); g.beginPath(); for(var k2=0;k2<6;k2++){ var ka2=k2/6*6.284; var kr2=(k2%2===0)?10:6; if(k2) g.lineTo(Math.cos(ka2)*kr2,Math.sin(ka2)*kr2); else g.moveTo(Math.cos(ka2)*kr2,Math.sin(ka2)*kr2); } g.closePath(); g.fill(); g.restore(); } }
    else if(id==='arcaneSwarm'){ g.shadowBlur=20; for(var a2=0;a2<8;a2++){ var aa2=a2/8*6.284; g.beginPath(); g.arc(Math.cos(aa2)*16,Math.sin(aa2)*16,4+(a2%2?1:3),0,6.284); g.fill(); } }
    else if(id==='singularityBeam'){ g.fillRect(-25,-8,50,16); g.fillStyle='#fff'; g.fillRect(-25,-3,50,6); var gr3=g.createRadialGradient(0,0,0,0,0,22); gr3.addColorStop(0,'#000'); gr3.addColorStop(0.6,'#b388ff'); gr3.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr3; g.beginPath(); g.arc(0,0,22,0,6.284); g.fill(); }
    else if(id==='celestialPack'){ g.shadowBlur=22; for(var c2=0;c2<5;c2++){ var ca2=c2/5*6.284; g.beginPath(); g.arc(Math.cos(ca2)*20,Math.sin(ca2)*20,6,0,6.284); g.fill(); } g.beginPath(); g.arc(0,0,8,0,6.284); g.fill(); }
    else if(id==='plaguefire'){ for(var p2=0;p2<5;p2++){ g.globalAlpha=1-p2*0.15; g.fillStyle=p2<2?'#ffeb3b':'#aeea00'; g.beginPath(); g.arc(-8+p2*8,Math.sin(p2*2)*4,11-p2,0,6.284); g.fill(); } g.globalAlpha=1; }
    else if(id==='blightedFrost'){ g.strokeStyle='#4dd0e1'; g.lineWidth=3; g.beginPath(); g.arc(0,0,22,0,6.284); g.stroke(); g.strokeStyle='#80cbc4'; g.lineWidth=2; g.beginPath(); g.arc(0,0,14,0,6.284); g.stroke(); g.fillStyle='#4dd0e1'; g.beginPath(); g.arc(0,0,6,0,6.284); g.fill(); }
    else if(id==='overloadGrid'){ g.strokeStyle='#80cbc4'; g.lineWidth=2; for(var g2=0;g2<3;g2++){ g.beginPath(); g.arc(0,0,10+g2*6,0,6.284); g.stroke(); } g.fillStyle='#80cbc4'; g.beginPath(); g.arc(0,0,7,0,6.284); g.fill(); }
    else if(id==='solarSigil'){ g.strokeStyle='#ffca28'; g.lineWidth=3; g.beginPath(); for(var rn2=0;rn2<6;rn2++){ var rna2=rn2/6*6.284-Math.PI/2; var rnr2=22; if(rn2) g.lineTo(Math.cos(rna2)*rnr2,Math.sin(rna2)*rnr2); else g.moveTo(Math.cos(rna2)*rnr2,Math.sin(rna2)*rnr2); } g.closePath(); g.stroke(); g.fillStyle='#ffca28'; g.beginPath(); g.arc(0,0,8,0,6.284); g.fill(); }
    else if(id==='boomTrap'){ g.beginPath(); g.arc(0,0,20,-0.9,0.9); g.arc(0,0,12,0.9,-0.9,true); g.closePath(); g.fill(); g.beginPath(); g.arc(0,0,6,0,6.284); g.fill(); }
    else { g.beginPath(); g.arc(0,0,18,0,6.284); g.fill(); }
  }
  else { g.beginPath(); g.arc(0,0,15,0,6.284); g.fill(); }
  g.restore();
}

function showScreen(id){
  var screens=document.querySelectorAll('.screen');
  for(var i=0;i<screens.length;i++) screens[i].classList.remove('on');
  if(id){ var s=$id(id); if(s) s.classList.add('on'); }
  var gb=$id('btnGlobalBack');
  if(gb){ if(id&&id!=='s-main'&&id!=='s-levelup'&&id!=='s-chest'&&id!=='s-fuse') gb.classList.add('on'); else gb.classList.remove('on'); }
}

function showCharacters(){
  state='menu';
  var el=$id('s-chars');
  var html='<h2>Characters</h2><div class="sub">Each has unique base stats, a passive, and a starting weapon.</div><div class="row">';
  for(var i=0;i<CHARACTERS.length;i++){
    var c=CHARACTERS[i];
    var owned=save.chars.indexOf(c.id)>=0;
    var dlcLocked=c.dlc && save.dlc.indexOf(c.dlc)<0;
    var sel=save.selectedChar===c.id;
    html+='<div class="card '+(owned?'':'locked')+(sel?' sel':'')+'" data-id="'+c.id+'" style="width:230px">'+
      (owned?'<div class="lock" style="color:#7ee0a8">'+(sel?'SELECTED':'OWNED')+'</div>':'<div class="lock">'+c.cost+' SOFT</div>')+
      '<canvas class="preview" id="prev_char_'+c.id+'" width="200" height="140"></canvas>'+
      '<h4 style="color:'+c.color+'">'+c.name+(dlcLocked?' (DLC)':'')+'</h4>'+
      '<p>'+c.desc+'<br><span style="color:#7ee0a8">'+c.passive+'</span></p>'+
      '<div class="tag">HP '+c.hp+' | SPD '+c.spd+' | DMG x'+c.dmg.toFixed(2)+'</div>'+
      '<div class="tag">Weapon: '+WEAPONS[c.weapon].name+'</div>'+
      '<div class="price">'+(owned?(sel?'SELECTED':'TAP TO SELECT'):(dlcLocked?'Requires DLC':'UNLOCK '+c.cost+' SOFT'))+'</div>'+
    '</div>';
  }
  html+='</div><div style="margin-top:16px"><button class="backBtn">BACK</button></div>';
  el.innerHTML=html;
  for(var p=0;p<CHARACTERS.length;p++){ var cvs=$id('prev_char_'+CHARACTERS[p].id); if(cvs) drawPreviewChar(cvs,CHARACTERS[p].id); }
  var cards=el.querySelectorAll('.card');
  for(var k=0;k<cards.length;k++){
    cards[k].onclick=(function(card){ return function(){
      var id=card.getAttribute('data-id');
      var c=CHARACTERS.filter(function(x){return x.id===id;})[0];
      if(c.dlc && save.dlc.indexOf(c.dlc)<0){ msg('Requires the Neon Grid DLC.'); return; }
      if(save.chars.indexOf(id)>=0){ save.selectedChar=id; persist(); msg(c.name+' selected.'); showCharacters(); return; }
      if(save.soft>=c.cost || save.devMode){
        if(!save.devMode) save.soft-=c.cost;
        save.chars.push(id); save.selectedChar=id; persist();
        msg(c.name+' unlocked!'); showCharacters();
      } else msg('Not enough soft currency.');
    }; })(cards[k]);
  }
  el.querySelector('.backBtn').onclick=showMain;
  showScreen('s-chars');
}

function showArmory(){

      '<h4 style="color:'+w.color+'">'+w.name+'</h4>'+
      '<p>'+w.desc+'</p>'+
      '<div class="tag">CD '+w.base.cd+'s | DMG '+w.base.dmg+'</div>'+
      (isEvo?'<div class="price" style="color:#b388ff">EVOLUTION</div>':'<div class="price">'+(owned?'OWNED':'UNLOCK '+w.cost+' SOFT')+'</div>')+
    '</div>';
  }
  html+='</div><div style="margin-top:16px"><button class="backBtn">BACK</button></div>';
  el.innerHTML=html;

      if(save.soft>=w.cost || save.devMode){
        if(!save.devMode) save.soft-=w.cost;
        save.weapons.push(id); persist(); msg(w.name+' unlocked!'); showArmory();
      } else msg('Not enough soft currency.');

  showScreen('s-armory');

function showTree(){
  state='menu';
  var el=$id('s-tree');
  var freeRespecs=Math.max(0,3-save.respecs);
  var respecCost=freeRespecs>0?0:25;
  var html='<h2>Ascension Tree</h2>'+
    '<div class="sub">Permanent upgrades. Respecs: '+(freeRespecs>0?freeRespecs+' free remaining':respecCost+' HC each')+'.</div>'+
    '<div class="currency"><div><span class="soft">SOFT</span> <b class="soft">'+save.soft+'</b></div>'+
    '<div><span class="hard">HARD</span> <b class="hard">'+save.hard+'</b></div></div>'+
    '<div class="tree">';
  for(var b=0;b<4;b++){
    html+='<div class="branch"><h4>'+BRANCHES[b]+'</h4>';
    var nodes=TREE.filter(function(x){return x.br===b;});
    for(var ni=0;ni<nodes.length;ni++){
      var n=nodes[ni];
      var owned=save.tree.indexOf(n.id)>=0;
      var prev=TREE.filter(function(x){return x.br===b&&x.tier===n.tier-1;})[0];
      var available=n.tier===0||(prev&&save.tree.indexOf(prev.id)>=0);
      var cls=owned?'owned':(available?'':'locked');
      html+='<div class="node '+cls+' '+(n.key?'key':'')+' '+(n.cap?'cap':'')+'" data-id="'+n.id+'" data-avail="'+(available&&!owned)+'">'+
        '<b>'+n.name+'</b><small>'+n.desc+'</small>'+
        (owned?'<span class="c">OK</span>':'<span class="c">'+n.cost+'</span>')+
      '</div>';
    }
    html+='</div>';
  }
  html+='</div><div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center">'+
    '<button id="bRespec">RESPEC '+(freeRespecs>0?'(FREE)':'('+respecCost+' HC)')+'</button>'+
    '<button class="backBtn">BACK</button></div>';
  el.innerHTML=html;
  var nodes=el.querySelectorAll('.node');
  for(var k=0;k<nodes.length;k++){
    nodes[k].onclick=(function(nd){ return function(){
      var n=TREE.filter(function(x){return x.id===nd.getAttribute('data-id');})[0];
      if(save.tree.indexOf(n.id)>=0) return;
      if(nd.getAttribute('data-avail')!=='true'){ msg('Unlock the previous node first.'); return; }
      if(save.soft>=n.cost || save.devMode){
        if(!save.devMode) save.soft-=n.cost;
        save.tree.push(n.id); persist(); msg(n.name+' unlocked!'); showTree();
      } else msg('Not enough soft currency.');
    }; })(nodes[k]);
  }
  $id('bRespec').onclick=function(){
    if(save.tree.length===0){ msg('Nothing to respec.'); return; }
    if(freeRespecs>0){ save.respecs++; save.tree=[]; persist(); msg('Free respec used.'); }
    else if(save.hard>=respecCost || save.devMode){ if(!save.devMode) save.hard-=respecCost; save.tree=[]; persist(); msg('Respec complete.'); }
    else { msg('Not enough hard currency.'); return; }
    showTree();
  };
  el.querySelector('.backBtn').onclick=showMain;
  showScreen('s-tree');
}

    '<div class="row" id="shoprow" style="max-width:1200px"></div>'+
    '<div style="margin-top:16px"><button class="backBtn">BACK</button></div>';
  el.innerHTML=html;
  var row=$id('shoprow');
  function renderTab(tab){
    row.innerHTML='';
    if(tab==='skin'){
      for(var i=0;i<COSMETICS.length;i++){
        (function(c){
          var owned=save.cosmetics.indexOf(c.id)>=0;
          var equipped=false; for(var kk in save.equip) if(save.equip[kk]===c.id) equipped=true;
          var d=document.createElement('div');
          d.className='card';
          d.innerHTML='<h4 style="color:'+(c.color||c.tint||'#8ecae6')+'">'+c.name+'</h4>'+
            '<p>'+(c.cat==='char'?'Character skin - replaces your hero sprite':
                c.cat==='weapon'?'Weapon skin - recolors projectiles':
                c.cat==='ability'?'Ability skin - recolors ability FX':'UI skin - changes accent color')+'</p>'+
            '<div class="price">'+(owned?(equipped?'EQUIPPED (tap to unequip)':'OWNED (tap to equip)'):'HARD '+c.price)+'</div>';
          d.onclick=function(){
            if(owned){
              if(equipped){ for(var kkk in save.equip) if(save.equip[kkk]===c.id) save.equip[kkk]=null; }
              else { save.equip[c.cat]=c.id; if(c.cat==='ui') applyUISkin(c.accent); }
              persist(); renderTab('skin'); return;
            }
            if(save.hard>=c.price || save.devMode){
              if(!save.devMode) save.hard-=c.price;
              save.cosmetics.push(c.id); save.equip[c.cat]=c.id;
              if(c.cat==='ui') applyUISkin(c.accent);
              persist(); msg(c.name+' unlocked!'); renderTab('skin');
            } else msg('Not enough hard currency.');
          };
          row.appendChild(d);
        })(COSMETICS[i]);
      }
    } else if(tab==='bundle'){
      for(var bi=0;bi<BUNDLES.length;bi++){
        (function(b){
          var owned=b.items.every(function(i){return save.cosmetics.indexOf(i)>=0;});
          var d=document.createElement('div');
          d.className='card';
          d.innerHTML='<h4 style="color:#ffd54f">'+b.name+'</h4><p>'+b.desc+'</p>'+
            '<div class="tag">'+b.items.length+' items</div>'+
            '<div class="price">'+(owned?'OWNED':'HARD '+b.price)+'</div>';
          d.onclick=function(){
            if(owned){ msg('Already owned.'); return; }
            if(save.hard>=b.price || save.devMode){
              if(!save.devMode) save.hard-=b.price;
              for(var i=0;i<b.items.length;i++) if(save.cosmetics.indexOf(b.items[i])<0) save.cosmetics.push(b.items[i]);
              persist(); msg(b.name+' unlocked!'); renderTab('bundle');
            } else msg('Not enough hard currency.');
          };
          row.appendChild(d);
        })(BUNDLES[bi]);
      }
    } else if(tab==='hc'){
      for(var hi=0;hi<HC_PACKS.length;hi++){
        (function(p){
          var d=document.createElement('div');
          d.className='card';
          d.innerHTML='<h4 class="hard">'+p.hc.toLocaleString()+' HC</h4>'+
            '<p>Hard currency for cosmetics, respecs and DLC unlocks.</p>'+
            '<div class="price">'+p.price+'</div>';
          d.onclick=function(){
            if(!cosmeticsReleased()){ msg('Purchasing is disabled until cosmetics release.'); return; }
            save.hard+=p.hc; persist(); msg('+'+p.hc+' HC (simulated purchase)'); showShop();
          };
          row.appendChild(d);
        })(HC_PACKS[hi]);
      }
    } else {
      for(var di=0;di<DLCS.length;di++){
        (function(d0){
          var owned=save.dlc.indexOf(d0.id)>=0;
          var d=document.createElement('div');
          d.className='card';
          d.innerHTML='<h4 style="color:#69f0ae">'+d0.name+'</h4>'+
            '<p>'+d0.desc+'</p>'+
            '<div class="tag">'+d0.size+' DLC</div>'+
            '<div class="price">'+(owned?'OWNED':d0.price+' or HARD '+d0.hc.toLocaleString())+'</div>';
          d.onclick=function(){
            if(owned){ msg('Already owned.'); return; }
            if(save.hard>=d0.hc || save.devMode){
              if(!save.devMode) save.hard-=d0.hc;
              save.dlc.push(d0.id);
              if(save.biomes.indexOf(4)<0) save.biomes.push(4);
              persist(); msg(d0.name+' unlocked!'); renderTab('dlc');
            } else msg('Not enough hard currency ('+d0.hc+' needed).');
          };
          row.appendChild(d);
        })(DLCS[di]);
      }
    }
  }
  var tabs=el.querySelectorAll('.tabs button');
  for(var t=0;t<tabs.length;t++){
    tabs[t].onclick=(function(btn){ return function(){
      var all=el.querySelectorAll('.tabs button');
      for(var z=0;z<all.length;z++) all[z].classList.remove('on');
      btn.classList.add('on'); renderTab(btn.getAttribute('data-tab'));
    }; })(tabs[t]);
  }
  renderTab('skin');
  el.querySelector('.backBtn').onclick=showMain;
  showScreen('s-shop');
}
function applyUISkin(accent){ document.documentElement.style.setProperty('--accent',accent||'#4fc3f7'); }

function pauseGame(){
  if(state!=='playing') return;
  state='paused';
  var el=$id('s-pause');
  el.innerHTML='<h2>Paused</h2>'+
    '<div class="sub">'+BIOMES[G.biome].name+' | '+G.mode.toUpperCase()+' | '+fmtTime(G.time)+'</div>'+
    '<div class="row" style="flex-direction:column;align-items:center">'+
      '<button class="primary" id="pResume">RESUME</button>'+
      '<button id="pQuit">ABANDON RUN</button>'+
    '</div>';
  $id('pResume').onclick=resumeGame;
  $id('pQuit').onclick=function(){ endRun(false); };
  showScreen('s-pause');
}
function resumeGame(){ state='playing'; showScreen(null); }

function showEnd(soft,hard,won){
  var el=$id('s-end');
  var b=BIOMES[G.biome];
  el.innerHTML=
    '<h1 style="font-size:26px">'+(won?'BIOME CLEARED':'RUN ENDED')+'</h1>'+
    '<div class="sub">'+b.name+' | '+G.mode.toUpperCase()+' | '+fmtTime(G.time)+'</div>'+
    '<div class="stats-row">'+
      '<div class="endstat">Kills: <b>'+G.kills+'</b></div>'+
      '<div class="endstat">Level: <b>'+P.level+'</b></div>'+
      '<div class="endstat">Damage taken: <b>'+Math.round(P.dmgTaken)+'</b></div>'+
    '</div>'+
    '<div class="currency" style="margin-top:14px">'+
      '<div><span class="soft">+'+soft+' SOFT</span></div>'+
      '<div><span class="hard">+'+hard+' HARD</span></div>'+
    '</div>'+
    (won?'<div class="sub" style="color:#7ee0a8;margin-top:6px">Endless unlocked for '+b.name+'!'+(save.biomes.length<5?' Next biome unlocked.':'')+'</div>':'')+
    '<div class="row" style="margin-top:12px">'+
      '<button class="primary" id="eAgain">PLAY AGAIN</button>'+
      '<button id="eMenu">MAIN MENU</button>'+
    '</div>';
  $id('eAgain').onclick=function(){ newGame(G.biome,G.mode,G.runTime); };
  $id('eMenu').onclick=function(){ showMain(); };
  showScreen('s-end');
}

/* ===== LOOP ===== */
function loop(ts){
  var dt=Math.min(0.05,(ts-lastTs)/1000||0.016);
  lastTs=ts;
  if(state==='playing' && G){ update(dt); }
  render();
  requestAnimationFrame(loop);
}

/* ===== RENDER ===== */
function drawWorldDeco(b,camLX,camLY){
  var T=140;
  var x0=Math.floor(camLX/T)-1, x1=Math.floor((camLX+W)/T)+1;
  var y0=Math.floor(camLY/T)-1, y1=Math.floor((camLY+H)/T)+1;
  for(var i=x0;i<=x1;i++) for(var j=y0;j<=y1;j++){
    var h=hash2(i,j);
    if(h>0.78){
      var px=i*T+h*T*0.6, py=j*T+hash2(j,i)*T*0.6;
      var s=(h-0.78)*3.4+0.12;
      ctx.fillStyle=b.deco; ctx.globalAlpha=0.55;
      ctx.beginPath(); ctx.arc(px,py,10+s*18,0,6.284); ctx.fill();
      ctx.globalAlpha=1;
    }
  }
  ctx.strokeStyle='rgba(255,255,255,0.018)'; ctx.lineWidth=1; ctx.beginPath();
  for(var k=x0;k<=x1;k++){ ctx.moveTo(k*T,camLY); ctx.lineTo(k*T,camLY+H); }
  for(var m=y0;m<=y1;m++){ ctx.moveTo(camLX,m*T); ctx.lineTo(camLX+W,m*T); }
  ctx.stroke();
}
function drawHazards(b,camLX,camLY){
  var CH=300;
  var x0=Math.floor(camLX/CH)-1, x1=Math.floor((camLX+W)/CH)+1;
  var y0=Math.floor(camLY/CH)-1, y1=Math.floor((camLY+H)/CH)+1;
  for(var i=x0;i<=x1;i++) for(var j=y0;j<=y1;j++){
    var h=hazardAt(G.biome,i,j); if(!h) continue;
    ctx.save();
    var col=h.type==='lava'?'#ff5722':h.type==='void'?'#7c4dff':h.type==='ice'?'#4fc3f7':h.type==='grid'?'#00e676':'#33691e';
    var grd=ctx.createRadialGradient(h.x,h.y,4,h.x,h.y,h.r);
    grd.addColorStop(0,col); grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=0.45; ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,6.284); ctx.fill();
    ctx.globalAlpha=0.6; ctx.strokeStyle=col; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,6.284); ctx.stroke();
    ctx.restore();
  }
}
function drawTouchJoystick(){
  if(!TOUCH.active) return;
  var cx=TOUCH.moveStartX, cy=TOUCH.moveStartY, R=TOUCH.maxR;
  ctx.save();
  ctx.globalAlpha=0.35; ctx.strokeStyle='#ffffff'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,6.284); ctx.stroke();
  ctx.globalAlpha=0.15; ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.arc(cx,cy,R,0,6.284); ctx.fill();
  ctx.globalAlpha=0.7; var kx=cx+TOUCH.moveVecX*R, ky=cy+TOUCH.moveVecY*R;
  ctx.fillStyle='#4fc3f7'; ctx.shadowColor='#4fc3f7'; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.arc(kx,ky,22,0,6.284); ctx.fill();
  ctx.restore();
}
function render(){
  var t=performance.now()/1000;
  var biome=BIOMES[G?G.biome:0];
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,biome.bg); g.addColorStop(1,biome.bg2);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  var sx=G?rand(-G.shake,G.shake):0, sy=G?rand(-G.shake,G.shake):0;
  var camLX=G?camX+sx:(Math.sin(t*0.3)*400), camLY=G?camY+sy:(Math.cos(t*0.4)*400);
  ctx.save(); ctx.translate(-camLX,-camLY);
  drawWorldDeco(biome,camLX,camLY);
  if(G) drawHazards(biome,camLX,camLY);
  if(G){
    for(var zi=0;zi<G.zones.length;zi++){
      var z=G.zones[zi];
      ctx.save();
      if(z.ring){
        var alpha=1-z.t/z.life;
        ctx.strokeStyle=z.color; ctx.globalAlpha=alpha*0.85;
        ctx.lineWidth=6*P.stats.area; ctx.shadowColor=z.color; ctx.shadowBlur=24;
        ctx.beginPath(); ctx.arc(z.x,z.y,z.r,0,6.284); ctx.stroke();
      } else if(z.mine){
        var blink=Math.sin(z.t*10)*0.3+0.7;
        ctx.globalAlpha=blink; ctx.fillStyle=z.color; ctx.shadowColor=z.color; ctx.shadowBlur=18;
        ctx.beginPath(); ctx.arc(z.x,z.y,z.r*0.6,0,6.284); ctx.fill();
        ctx.globalAlpha=0.4; ctx.strokeStyle=z.color; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(z.x,z.y,z.r+4+Math.sin(z.t*4)*3,0,6.284); ctx.stroke();
      } else if(z.rune){
        ctx.globalAlpha=0.9; ctx.strokeStyle=z.color; ctx.lineWidth=3;
        ctx.shadowColor=z.color; ctx.shadowBlur=20;
        ctx.beginPath(); ctx.arc(z.x,z.y,z.r,0,6.284); ctx.stroke();
        ctx.beginPath();
        for(var ri=0;ri<6;ri++){ var ra=ri/6*6.284+z.t*2;
          var rpx=z.x+Math.cos(ra)*z.r*0.7, rpy=z.y+Math.sin(ra)*z.r*0.7;
          if(ri) ctx.lineTo(rpx,rpy); else ctx.moveTo(rpx,rpy); }
        ctx.closePath(); ctx.stroke();
      } else if(z.pull){
        var grd=ctx.createRadialGradient(z.x,z.y,4,z.x,z.y,z.r);
        grd.addColorStop(0,'rgba(179,136,255,.85)');
        grd.addColorStop(0.5,'rgba(103,58,183,.35)');
        grd.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(z.x,z.y,z.r,0,6.284); ctx.fill();
      } else if(z.dot){
        ctx.globalAlpha=0.35; ctx.fillStyle=z.color;
        ctx.beginPath(); ctx.arc(z.x,z.y,z.r,0,6.284); ctx.fill();
        ctx.globalAlpha=0.6; ctx.strokeStyle=z.color; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(z.x,z.y,z.r,0,6.284); ctx.stroke();
      }
      ctx.restore();
    }
  }
  if(G){
    for(var pi=0;pi<G.pickups.length;pi++){
      var p=G.pickups[pi];
      ctx.save();
      if(p.type==='xp'){
        var pulse=1+Math.sin(t*6+p.x*0.01)*0.15;
        ctx.fillStyle='#4dd0e1'; ctx.shadowColor='#4dd0e1'; ctx.shadowBlur=12;
        ctx.beginPath(); ctx.arc(p.x,p.y,5*pulse,0,6.284); ctx.fill();
        ctx.fillStyle='#ffffff'; ctx.shadowBlur=0;
        ctx.beginPath(); ctx.arc(p.x,p.y,2,0,6.284); ctx.fill();
      } else if(p.type==='hp'){
        ctx.fillStyle='#66bb6a'; ctx.shadowColor='#66bb6a'; ctx.shadowBlur=16;
        ctx.beginPath(); ctx.arc(p.x,p.y,8,0,6.284); ctx.fill();
        ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
        ctx.fillText('+',p.x,p.y+4);
      } else if(p.type==='chest'){
        ctx.shadowColor='#ffd54f'; ctx.shadowBlur=22;
        var bob=Math.sin(t*3+p.x*0.01)*3;
        // Chest body
        ctx.fillStyle='#8d6e63';
        ctx.fillRect(p.x-14,p.y-8+bob,28,16);
        // Lid
        ctx.fillStyle='#5d4037';
        ctx.fillRect(p.x-14,p.y-8+bob,28,5);
        // Lock
        ctx.fillStyle='#ffd54f';
        ctx.fillRect(p.x-3,p.y-4+bob,6,8);
        // Glow ring
        ctx.strokeStyle='#ffd54f'; ctx.lineWidth=2; ctx.globalAlpha=0.6+Math.sin(t*4)*0.3;
        ctx.beginPath(); ctx.arc(p.x,p.y+bob,22,0,6.284); ctx.stroke();
        ctx.globalAlpha=1;
      }
      ctx.restore();
    }
  }
  if(G) for(var ei=0;ei<G.enemies.length;ei++){
    var e=G.enemies[ei];
    var spawnScale=e.spawnAnim>0?(1-e.spawnAnim*0.5):1;
    drawEnemySprite(ctx,e,e.x,e.y,e.r*spawnScale,t);
  }
  if(G) for(var wi=0;wi<P.weapons.length;wi++){ var wdef=WEAPONS[P.weapons[wi].id]||EVOLUTIONS[P.weapons[wi].id]; if(wdef&&wdef.drawFx) wdef.drawFx(P.weapons[wi]); }
  if(G) drawCharSprite(ctx,P.char.id,P.x,P.y,P.aim,P.r,t);
  if(G){
    for(var bi=0;bi<G.bullets.length;bi++) drawBulletSprite(ctx,G.bullets[bi]);
    for(var ebi2=0;ebi2<G.ebullets.length;ebi2++){
      var eb2=G.ebullets[ebi2];
      ctx.save(); ctx.shadowColor=eb2.color; ctx.shadowBlur=12; ctx.fillStyle=eb2.color;
      ctx.beginPath(); ctx.arc(eb2.x,eb2.y,eb2.r,0,6.284); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.5)';
      ctx.beginPath(); ctx.arc(eb2.x,eb2.y,eb2.r*0.5,0,6.284); ctx.fill();
      ctx.restore();
    }
    for(var bmi=0;bmi<G.beams.length;bmi++){
      var bm=G.beams[bmi];
      var a2=1-bm.t/bm.life;
      ctx.save(); ctx.globalAlpha=a2; ctx.strokeStyle=bm.color; ctx.shadowColor=bm.color;
      ctx.shadowBlur=22; ctx.lineWidth=bm.w*a2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(bm.x1,bm.y1); ctx.lineTo(bm.x2,bm.y2); ctx.stroke();
      ctx.restore();
    }
  }
  if(G){
    for(var pti=0;pti<G.particles.length;pti++){
      var pt=G.particles[pti];
      var pa=pt.life/pt.max;
      ctx.globalAlpha=pa; ctx.fillStyle=pt.color;
      ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r*pa,0,6.284); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  if(G){
    ctx.textAlign='center';
    for(var ti=0;ti<G.texts.length;ti++){
      var t2=G.texts[ti];
      var ta=1-t2.t/t2.life;
      ctx.globalAlpha=ta; ctx.fillStyle=t2.color;
      ctx.font='bold '+t2.size+'px Segoe UI, sans-serif';
      ctx.shadowColor='#000'; ctx.shadowBlur=4;
      ctx.fillText(t2.text,t2.x,t2.y);
    }
    ctx.globalAlpha=1; ctx.shadowBlur=0;
  }
  ctx.restore();
  if(state==='playing') drawTouchJoystick();
}

/* ===== BOOT ===== */
function boot(){
  try{
    resize();
    if(!save.selectedChar) save.selectedChar = save.chars[0]||'vanguard';
    if(save.devMode) applyDevMode();
    if(save.equip.ui){ var sk=COSMETICS.filter(function(c){return c.id===save.equip.ui;})[0]; if(sk&&sk.accent) applyUISkin(sk.accent); }
    showMain();
    requestAnimationFrame(loop);
  }catch(err){
    var e=$id('err');
    if(e){ e.style.display='block'; e.textContent += 'BOOT ERROR: '+err.message+'\n'+(err.stack||''); }
  }
}
boot();
})();
</script>
